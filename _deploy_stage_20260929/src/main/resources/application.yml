  key: ${ADMIN_KEY:LP@870263#lpsx}

# 本地联调限流配置（内存滑动窗口，按 IP 计数）
# 测试版会在同一局域网内并发请求多个接口，因此本地使用宽松阈值；
# 正式环境的较严格阈值在 application-cloud.yml 中单独覆盖。
rate-limit:
  lead: 200
  auth: 1000
  public-list: 5000
  public-search: 5000
  public-detail: 5000
  write: 2000
  temp-upload: 10
  distinct-details: 1000
  window-seconds: 60
  sustained-window-seconds: 600
  sustained-multiplier: 10
  max-page: 200
  max-page-size: 500
